<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Как оно живёт, это ваше АйТи?</title>
<style>
  :root { --red: #EF3124; --ink: #000; --paper: #fff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: var(--red); color: var(--paper);
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  form { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 34px; line-height: 1.15; }
  p { font-size: 15px; opacity: 0.9; }
  input[type=password] {
    font: inherit; font-size: 18px; padding: 14px 16px;
    border: 0; border-radius: 12px; color: var(--ink); background: var(--paper);
  }
  label { display: flex; gap: 8px; align-items: center; font-size: 15px; }
  button {
    font: inherit; font-weight: 700; font-size: 18px; padding: 14px 16px;
    border: 2px solid var(--paper); border-radius: 12px;
    background: transparent; color: var(--paper); cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .err { min-height: 20px; font-weight: 700; }
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Как оно живёт, это ваше АйТи?</h1>
  <p>Презентация защищена паролем.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" autofocus>
  <label><input id="remember" type="checkbox" checked> Запомнить на этом устройстве</label>
  <button id="go" type="submit">Открыть</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
// Сгенерировано scripts/build_site.py. Презентация лежит в deck.bin в зашифрованном виде.
// #k=<ключ> в адресе — открыть без ввода пароля; #logout — забыть ключ на устройстве.
(async function () {
  const SALT = 'HaVgwPkRJKhttPx4pFvc7A', ITER = 600000, STORE = 'it-life-deck-key';
  const $ = id => document.getElementById(id);
  const b64d = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const ls = {
    get() { try { return localStorage.getItem(STORE); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(STORE, v); } catch (e) {} },
    del() { try { localStorage.removeItem(STORE); } catch (e) {} },
  };

  let blob;
  async function data() {
    if (!blob) {
      const r = await fetch('deck.bin', { cache: 'no-cache' });
      if (!r.ok) throw new Error('fetch');
      blob = new Uint8Array(await r.arrayBuffer());
    }
    return blob;
  }

  const rawKey = s => crypto.subtle.importKey('raw', b64d(s), 'AES-GCM', true, ['decrypt']);
  async function passwordKey(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64d(SALT), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function unlock(key, remember) {
    const d = await data();
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, key, d.slice(12));
    if (remember) ls.set(b64e(await crypto.subtle.exportKey('raw', key)));
    document.open();
    document.write(new TextDecoder().decode(plain));
    document.close();
  }

  const hash = location.hash;
  if (hash === '#logout') ls.del();
  let candidate = hash.startsWith('#k=') ? hash.slice(3) : ls.get();
  if (hash === '#logout' || hash.startsWith('#k=')) history.replaceState(null, '', location.pathname);

  if (candidate) {
    try { await unlock(await rawKey(candidate), true); return; }
    catch (e) { ls.del(); }
  }

  $('f').hidden = false;
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    $('go').disabled = true;
    $('go').textContent = 'Открываю…';
    $('err').textContent = '';
    try {
      await unlock(await passwordKey($('pw').value), $('remember').checked);
    } catch (err) {
      $('err').textContent = err.message === 'fetch' ? 'Не удалось загрузить презентацию' : 'Неверный пароль';
      $('go').disabled = false;
      $('go').textContent = 'Открыть';
      $('pw').select();
    }
  });
})();
</script>
</body>
</html>
